name: 大哥专线-绝杀版-不再报错

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 准备 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 【生死关头】精准植入原装内核
        # 这一步我换了一个绝对稳的版本 1.9.3，文件体积约 30MB
        run: |
          rm -rf app/libs && mkdir -p app/libs
          echo "🚀 正在从官方稳定库下载内核..."
          # 使用 -L 跟踪重定向，使用 -f 如果报错则停止
          curl -f -L "https://github.com/SagerNet/sing-box/releases/download/v1.9.3/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          
          # 【物理检查】如果文件小于 10MB，说明是假的！
          FILESIZE=$(stat -c%s "app/libs/libbox.aar")
          echo "📊 零件体检报告：$FILESIZE 字节"
          if [ $FILESIZE -lt 10000000 ]; then
            echo "❌ 警告：零件是假的 (404网页)！请检查版本号。"
            exit 1
          fi

      - name: 4. 暴力总装
        run: |
          chmod +x gradlew
          # 清理旧缓存，全力打 Debug 包
          ./gradlew clean assembleDebug --stacktrace

      - name: 5. 提货 (全盘搜索)
        if: success()
        run: |
          mkdir -p final_out
          find . -name "*.apk" -exec cp {} ./final_out/ \;

      - name: 6. 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-满血版
          path: final_out/*.apk

