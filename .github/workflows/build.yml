name: 大哥专线-安卓终极成品包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 准备 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 强力下载“原装满血心脏” (libbox.aar)
        # 这一步是关键！我们直接从官方 Release 下载已经做好的 1.10.1 版本内核
        # 这个版本完美支持 Hy2 和 Reality 协议
        run: |
          mkdir -p app/libs
          echo "开始下载原装内核..."
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          
          # 校验文件大小：正常的内核应该在 30MB 左右
          FILESIZE=$(stat -c%s "app/libs/libbox.aar")
          echo "内核下载成功，当前大小: $FILESIZE 字节"
          if [ $FILESIZE -lt 10000000 ]; then
            echo "错误：内核下载失败或文件损坏（大小不对）！"
            exit 1
          fi

      - name: 4. 授权并执行总装
        # 根据你之前的日志，你的项目 Flavor 叫 Other
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug --stacktrace

      - name: 5. 提货 (上传 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-成品APK
          path: app/build/outputs/apk/other/debug/*.apk
