name: 大哥专线-稳健版打包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 自动拉取所有关联插件
          fetch-depth: 0

      - name: 2. 初始化 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 授权并清理环境
        run: |
          chmod +x gradlew
          ./gradlew clean

      - name: 4. 直接开始安卓编译 (跳过手动合成内核)
        # 我们直接打标准 Debug 版，它会自动去下载官方预编译好的 libbox 零件
        run: ./gradlew :app:assembleStandardDebug --stacktrace

      - name: 5. 提货 (上传 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-成品包
          path: app/build/outputs/apk/standard/debug/*.apk
