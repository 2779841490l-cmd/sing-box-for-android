name: 大哥专线-稳如老狗版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出【安卓套壳】代码
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: 2. 检出【Sing-box核心】代码
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.9.0  # 锁定1.9.0稳定版，严禁变动
          path: core-repo

      - name: 3. 准备 Go 1.21 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 4. 准备 Java 17 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. 暴力锁定系统 NDK 路径 (关键修复)
        # 不用插件，直接去系统目录找。GitHub Runner 默认把 NDK 装在这里。
        run: |
          # 找到系统里版本最新的 NDK 目录
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n1)
          
          # 把它写入 GitHub 的环境变量文件，让后续步骤都能看见
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          
          # 同时打印出来给你看，这次绝对不为空
          echo "✅ 锁定 NDK 路径: $NDK_PATH"

      - name: 6. 安装编译工具 Gomobile
        # 对应 Sing-box 1.9.0 的 go.mod 依赖版本
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20231127183840-76ac6878050a
          gomobile init

      - name: 7. 现场合成内核 (libbox.aar)
        # 这一步会自动读取第5步设置的 ANDROID_NDK_HOME
        run: |
          cd core-repo
          echo "当前使用的 NDK: $ANDROID_NDK_HOME"
          
          # 开始编译
          go run ./cmd/internal/build_libbox -target android
          
          # 搬运
          if [ -f "libbox.aar" ]; then
             echo "🎉 内核合成成功！"
             mkdir -p ../app-repo/app/libs
             cp libbox.aar ../app-repo/app/libs/
          else
             echo "❌ 编译失败，请截图日志"
             exit 1
          fi

      - name: 8. 最终打包 APK
        run: |
          cd app-repo
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 9. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-绝对能用版
          path: app-repo/app/build/outputs/apk/**/*.apk
