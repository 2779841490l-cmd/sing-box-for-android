name: 大哥专线-官方逻辑通关版

on:
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码 (必须包含子模块)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: 2. 准备 Go 环境 (用于编译内核)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # 官方用的是最新的，咱们也跟上

      - name: 3. 准备安卓 NDK (锁定官方要求的 r28)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: 4. 准备 Java 环境 (Java 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. 编译内核零件 (这是最关键的一步)
        run: |-
          # 安装编译工具
          make lib_install
          # 编译 Android 专用的 AAR 内核
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 6. 搬运内核并总装
        run: |-
          # 创建 libs 文件夹并把刚编出来的 AAR 扔进去
          mkdir -p clients/android/app/libs
          cp *.aar clients/android/app/libs/
          
          # 切换到安卓子目录
          cd clients/android
          chmod +x gradlew
          # 官方打的是 Release 包，咱们打 Debug 包速度更快且不用签名
          ./gradlew :app:assembleOtherDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 7. 全盘搜救成品 APK
        run: |
          mkdir -p final_apks
          find clients/android/app/build/outputs/apk -name "*.apk" -exec cp {} ./final_apks/ \;
          ls -R ./final_apks/

      - name: 8. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-官方原装版
          path: ./final_apks/*.apk
