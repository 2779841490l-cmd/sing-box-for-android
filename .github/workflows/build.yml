name: 大哥专线-真·源码编译最终版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出【安卓套壳】代码
        uses: actions/checkout@v4
        with:
          path: app-repo  # 安卓工程放在 app-repo 文件夹

      - name: 2. 检出【Sing-box核心】代码
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.9.0 # 锁定一个绝对稳定的核心版本
          path: core-repo  # 核心源码放在 core-repo 文件夹

      - name: 3. 准备 Go 1.21 环境 (配合旧版工具)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' 

      - name: 4. 准备 Java 17 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. 安装 2023 年的旧版 Gomobile (解决报错核心)
        run: |
          # 这次用的是绝对真实的 commit ID，时间是 2023-11-27，绝对支持 -libname 参数
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20231127183840-76ac6878050a
          
          # 初始化环境
          gomobile init
          echo "✅ 旧版编译工具安装完成！"

      - name: 6. 现场合成满血内核 (libbox.aar)
        run: |
          # 进入核心源码目录
          cd core-repo
          
          # 开始编译 (因为工具是旧的，这步绝对不会再报 flag provided but not defined)
          go run ./cmd/internal/build_libbox -target android
          
          # 检查并搬运
          if [ -f "libbox.aar" ]; then
             echo "🎉 内核合成成功！正在搬运..."
             mkdir -p ../app-repo/app/libs
             cp libbox.aar ../app-repo/app/libs/
          else
             echo "❌ 内核合成失败，请查看上方日志"
             exit 1
          fi

      - name: 7. 最终总装 (编译 APK)
        run: |
          cd app-repo
          chmod +x gradlew
          # 使用最通用的打包命令
          ./gradlew assembleDebug --stacktrace

      - name: 8. 提货 (上传 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-源码编译终极版
          path: app-repo/app/build/outputs/apk/**/*.apk
