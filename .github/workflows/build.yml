name: 大哥专线-全量满血打包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 初始化 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 强行植入内核心脏 (防止找不到零件报错)
        run: |
          mkdir -p app/libs
          # 自动下载官方最稳的 arm64 内核
          curl -L https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar -o app/libs/libbox.aar

      - name: 4. 暴力全量打包
        # assembleDebug 会自动寻找所有可用的版本（比如 standardDebug, playDebug 等）
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 5. 提货 (把所有生成的 APK 都给你)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-全系列成品
          path: app/build/outputs/apk/**/*.apk
