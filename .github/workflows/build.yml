name: 大哥专线-全自动手搓最新版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出【安卓壳子】代码
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: 2. 检出【最新核心】源码
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: main  # 强制使用官网最新代码，1.12/1.13 通吃
          path: core-repo

      - name: 3. 准备环境 (Go 1.24 + Java 17 + NDK)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # 必须用最新的 Go，否则编不动新版核心
      
      - name: 4. 准备安卓 NDK (最新 r27)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: 5. 核心步骤：现场“手搓”发动机 (AAR)
        run: |
          cd core-repo
          # 这是官方最正宗的编译命令，不需要 Makefile
          go run ./cmd/internal/build_libbox -target android
          
          # 检查手搓成果
          if [ -f "libbox.aar" ]; then
             echo "✅ 发动机手搓成功！"
             mkdir -p ../app-repo/app/libs
             cp libbox.aar ../app-repo/app/libs/
          else
             echo "❌ 手搓失败，代码有问题！"
             exit 1
          fi

      - name: 6. 最后的总装 (APK)
        run: |
          cd app-repo
          chmod +x gradlew
          # 自动寻找你能用的打包任务
          TASK=$(./gradlew tasks --all | grep "^assemble.*Debug" | head -n 1 | awk '{print $1}')
          ./gradlew $TASK --stacktrace

      - name: 7. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-手搓最新版
          path: app-repo/app/build/outputs/apk/**/*.apk
