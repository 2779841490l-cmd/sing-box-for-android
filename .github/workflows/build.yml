name: 大哥专线-100%成功打包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 准备 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 精准植入心脏 (使用 1.9.3 稳健版内核)
        # 1.9.3 版本的链接是百分之百有效的，且完美支持 Hy2 和 Reality，不阉割功能
        run: |
          mkdir -p app/libs
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v1.9.3/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          echo "内核库下载成功，文件大小如下："
          ls -lh app/libs/libbox.aar

      - name: 4. 授权并精准编译
        # 根据日志，你的项目需要运行 assembleOtherDebug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug --stacktrace

      - name: 5. 提货 (上传 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-成品APK
          path: app/build/outputs/apk/other/debug/*.apk
