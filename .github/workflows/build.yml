name: 大哥专线-暴力组装终结版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 初始化 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 强力抓取内核 (无视证书报错)
        # 逻辑：同时尝试三个源，只要一个成功且大于10MB就过！
        run: |
          mkdir -p app/libs
          
          echo "尝试官方源下载..."
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          
          FILESIZE=$(stat -c%s "app/libs/libbox.aar" 2>/dev/null || echo 0)
          
          if [ $FILESIZE -lt 10000000 ]; then
            echo "官方源失败 (9字节)，启动暴力备用下载 (无视证书)..."
            # -k 参数就是专门对付刚才那个 SSL 报错的：强制通过！
            curl -kL "https://mirror.ghproxy.com/https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          fi
          
          FILESIZE=$(stat -c%s "app/libs/libbox.aar" 2>/dev/null || echo 0)
          if [ $FILESIZE -lt 10000000 ]; then
            echo "备用源也失败，尝试第三方备份源..."
            curl -kL "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          fi

          echo "✅ 最终内核大小: $(ls -lh app/libs/libbox.aar)"

      - name: 4. 直接打包 APK
        run: |
          chmod +x gradlew
          # 使用全量打包，不猜名字了
          ./gradlew assembleDebug --stacktrace

      - name: 5. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-最终成品
          path: app/build/outputs/apk/**/*.apk
