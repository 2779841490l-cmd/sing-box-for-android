name: 大哥专线-NekoBox满血版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 准备 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 借用 NekoBox 满血内核 (100% 可用)
        # 使用 MatsuriDayo 团队维护的稳定版内核 (v1.10.0)
        # 包含了 Hy2, Reality 等所有协议，无阉割
        run: |
          mkdir -p app/libs
          echo "正在从 NekoBox 仓库拉取内核..."
          curl -L "https://github.com/MatsuriDayo/libbox/releases/download/1.10.0/libbox-1.10.0-android-arm64-v8a.aar" -o app/libs/libbox.aar
          
          # 再次校验大小 (正常的应该在 10MB - 30MB 之间)
          FILESIZE=$(stat -c%s "app/libs/libbox.aar")
          echo "当前内核大小: $FILESIZE 字节"
          
          if [ $FILESIZE -lt 5000000 ]; then
             echo "❌ 致命错误：下载的文件太小，可能是死链！停止打包。"
             exit 1
          else
             echo "✅ 内核校验通过！准备组装。"
          fi

      - name: 4. 授权并执行总装
        # 根据你的日志，项目需要 build 'Other' flavor
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug --stacktrace

      - name: 5. 提货 (上传 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-Neko内核版
          path: app/build/outputs/apk/other/debug/*.apk
