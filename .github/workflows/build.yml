name: 大哥专线-满血版全自动打包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 初始化环境 (Java 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 强行植入“核心心脏” (解决 libbox.aar 缺失)
        run: |
          mkdir -p app/libs
          # 从官方稳定频道下载最新的原装内核
          curl -L https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar -o app/libs/libbox.aar
          echo "内核下载完成，准备组装..."

      - name: 4. 授权并清理
        run: |
          chmod +x gradlew
          ./gradlew clean

      - name: 5. 组装满血版 APK
        # 我们直接打 StandardDebug 版，这是目前性能最强的版本
        run: ./gradlew :app:assembleStandardDebug --stacktrace

      - name: 6. 提货 (上传 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-满血成品
          path: app/build/outputs/apk/standard/debug/*.apk
