name: 大哥专线-安卓客户端终极版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 准备 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 官方内网调拨最新内核 (Hy2+Reality满血版)
        # 逻辑：直接抓取 SagerNet 官方最新发布的安卓内核，绝对不 404
        run: |
          mkdir -p app/libs
          echo "🚀 正在通过官方最新通道提货..."
          curl -kL "https://github.com/SagerNet/sing-box/releases/latest/download/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          
          # 检查文件大小 (正常的内核约 30MB)
          FILESIZE=$(stat -c%s "app/libs/libbox.aar")
          echo "📊 内核体检：$FILESIZE 字节"
          if [ $FILESIZE -lt 10000000 ]; then
            echo "❌ 提货失败，零件不对！"
            exit 1
          fi

      - name: 4. 自动化识别并执行打包
        # 逻辑：不管你的项目叫 Standard 还是 Other，让脚本自己找能跑的任务
        run: |
          chmod +x gradlew
          # 先清理
          ./gradlew clean
          # 自动寻找第一个可用的 Debug 任务
          TASK=$(./gradlew tasks --all | grep "^assemble.*Debug" | head -n 1 | awk '{print $1}')
          echo "🎯 锁定目标任务: $TASK"
          ./gradlew $TASK --stacktrace

      - name: 5. 全盘搜救成品 APK
        run: |
          mkdir -p final_apks
          find . -name "*.apk" -type f -exec cp {} ./final_apks/ \;
          echo "--- 搜救清单 ---"
          ls ./final_apks/

      - name: 6. 提货 (上传 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-客户端成品
          path: ./final_apks/*.apk
