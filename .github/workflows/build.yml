name: 大哥专线-时光倒流编译版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 准备 Go 环境 (用于制造内核)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # 使用稳重的 1.22 版本

      - name: 3. 准备 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. 关键步骤：安装旧版编译器 (避开报错)
        run: |
          # ❌ 不要用 @latest，那是导致报错的元凶
          # ✅ 我们强行安装 2024 年的旧版本，它支持 -libname 参数
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20240213143200-b6d58f480430
          
          # 初始化环境
          gomobile init
          
          echo "✅ 旧版 Gomobile 安装成功，准备开始合成..."

      - name: 5. 现场合成满血内核
        run: |
          # 这一步之前报错是因为工具太新，现在工具换旧了，一定能过
          go run ./cmd/internal/build_libbox -target android
          
          # 检查是否生成成功
          if [ -f "app/libs/libbox.aar" ]; then
             echo "🎉 成功！内核已生成！"
             ls -lh app/libs/libbox.aar
          else
             echo "❌ 还是失败了？不应该啊！"
             exit 1
          fi

      - name: 6. 安卓打包总装
        run: |
          chmod +x gradlew
          # 使用最宽容的 assembleDebug 命令
          ./gradlew assembleDebug --stacktrace

      - name: 7. 提货 (上传 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-时光机版
          path: app/build/outputs/apk/**/*.apkapp/build/outputs/apk/**/*.apk
