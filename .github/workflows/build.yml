name: 大哥专线-智能提货版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 给机器人赋予读写权限

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 准备 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 智能拉取满血内核 (使用 gh 命令行)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 使用系统令牌，无需配置
        run: |
          mkdir -p app/libs
          echo "正在呼叫 GitHub 仓库寻找内核..."
          
          # 逻辑修正：不再用 curl 瞎猜链接，使用 gh 官方工具自动搜索下载
          # 目标仓库：MatsuriDayo/libbox (最稳的第三方库)
          # 目标版本：v1.10.0 (稳定版)
          # 匹配模式：*android-arm64-v8a.aar (自动匹配文件名，不再怕改名)
          
          gh release download v1.10.0 -R MatsuriDayo/libbox -p "*android-arm64-v8a.aar" -D app/libs/ || { echo "下载失败"; exit 1; }
          
          # 重命名文件，因为下载下来的名字很长，我们要把它变成 app 认识的名字
          mv app/libs/*android-arm64-v8a.aar app/libs/libbox.aar
          
          # 最终质检：如果文件小于 5MB，直接熔断报错，不浪费时间
          FILESIZE=$(stat -c%s "app/libs/libbox.aar")
          echo "成功捕获内核，体积: $FILESIZE 字节"
          
          if [ $FILESIZE -lt 5000000 ]; then
            echo "❌ 严重错误：下载的是个空壳！停止流水线。"
            exit 1
          fi

      - name: 4. 清理旧缓存并编译
        run: |
          chmod +x gradlew
          ./gradlew clean
          # 使用最通用的 assembleDebug，自动适配所有版本
          ./gradlew assembleDebug --stacktrace

      - name: 5. 提货 (上传所有产出)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-最终成品
          path: app/build/outputs/apk/**/*.apk
