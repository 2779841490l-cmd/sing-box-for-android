name: 大哥专线-终极组装-不再报错版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 准备 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 强力“捕获”内核 (逻辑闭环版)
        run: |
          mkdir -p app/libs
          
          # 核心修正：使用 wget 替代 curl，强制 http1.1 协议，避开 PROTOCOL_ERROR
          # 同时增加 --no-check-certificate 和 10 次重试逻辑
          wget --http-user-agent="Mozilla/5.0" \
               --no-check-certificate \
               --protocol-directories \
               --tries=10 \
               --retry-connrefused \
               --waitretry=3 \
               "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar" \
               -O app/libs/libbox.aar || {
                 echo "官方链失败，尝试直连镜像..."
                 # 强制使用 wget 且不检查证书，暴力下载
                 wget --no-check-certificate --tries=5 "https://ghproxy.com/https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar" -O app/libs/libbox.aar
               }

          # 物理校验：检查下载的文件到底是不是真家伙
          FILESIZE=$(stat -c%s "app/libs/libbox.aar")
          echo "✅ 捕获内核大小: $FILESIZE 字节"
          
          if [ $FILESIZE -lt 10000000 ]; then
            echo "❌ 严重警告：文件体积不对，下载失败！"
            exit 1
          fi

      - name: 4. 暴力编译 APK
        run: |
          chmod +x gradlew
          # 使用 clean 确保没有残留，然后 assembleDebug 扫描所有版本
          ./gradlew clean assembleDebug --stacktrace

      - name: 5. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-满血成品
          path: app/build/outputs/apk/**/*.apk
