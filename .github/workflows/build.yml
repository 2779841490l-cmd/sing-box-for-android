name: 大哥专线-安卓终极成功版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 准备 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 强力下载并校验内核 (核心步骤)
        # 切换到一个 100% 稳定的最新内核链接 (v1.10.7)
        run: |
          mkdir -p app/libs
          # 下载 sing-box 官方预编译内核
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v1.10.7/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          
          # 检查文件大小，正常的 libbox.aar 应该在 30MB 左右
          FILESIZE=$(stat -c%s "app/libs/libbox.aar")
          echo "下载的内核大小为: $FILESIZE 字节"
          if [ $FILESIZE -lt 5000000 ]; then
            echo "错误：内核文件损坏或下载失败 (太小了)！"
            exit 1
          fi

      - name: 4. 授权并执行编译
        # 既然系统默认走 Other 分支，我们就直接针对它编译
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug --stacktrace

      - name: 5. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-成品APK
          path: app/build/outputs/apk/other/debug/*.apk
