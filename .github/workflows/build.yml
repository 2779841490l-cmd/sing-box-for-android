name: 大哥专线-全自动定制工厂

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 安装 Go 环境 (合成内核)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 3. 安装 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. 强制合成 libbox 内核 (解决之前的报错)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          # 这里会自动生成缺失的 aar 零件
          go run ./cmd/internal/build_libbox -target android

      - name: 5. 编译成品 APK
        run: chmod +x gradlew && ./gradlew :app:assembleStandardDebug

      - name: 6. 提货 (上传 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-成品包
          path: app/build/outputs/apk/standard/debug/*.apk
