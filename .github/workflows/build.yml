name: 大哥专线-全盘搜救终结版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 初始化 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 强制获取核心零件 (gh 官方直取)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          # 尝试下载核心，如果下载失败，这一步会直接报红，不耽误后面时间
          gh release download v1.10.1 --repo SagerNet/sing-box --pattern "libbox-android-arm64-v8a.aar" --output app/libs/libbox.aar || echo "官方库取货失败，尝试备用货源"
          
          # 如果还是没拿到，强制从另一个稳健地址抓
          if [ ! -f "app/libs/libbox.aar" ]; then
            curl -L "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          fi
          echo "✅ 内核状态: $(ls -lh app/libs/libbox.aar)"

      - name: 4. 暴力全量打包 (不再点名，全部都打)
        run: |
          chmod +x gradlew
          # 这一步会尝试编译项目里所有的 Debug 变体
          ./gradlew assembleDebug --stacktrace || echo "部分打包失败，尝试继续..."

      - name: 5. 【核心改动】地毯式搜索 APK 文件
        # 我们不再信任固定的路径，直接用 find 命令全盘搜索
        run: |
          echo "--- 正在全盘搜索生成的成品 ---"
          mkdir -p ./final_apks
          # 寻找所有生成的 apk，并拷贝到根目录下的 final_apks 文件夹
          find . -name "*.apk" -type f -exec cp {} ./final_apks/ \;
          
          echo "--- 搜索报告 ---"
          ls -R ./final_apks/

      - name: 6. 提货 (上传所有搜救到的 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-成品合集
          # 只要 final_apks 文件夹里有东西，就一定能上传
          path: ./final_apks/*.apk
          if-no-files-found: error
