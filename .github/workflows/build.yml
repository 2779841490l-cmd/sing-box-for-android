name: 大哥专线-作者官方原装流程版

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        default: "1.0.0"
        required: true

jobs:
  build_android:
    name: 按照作者逻辑-编译Android
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码 (必须包含子模块)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive' # 这一步极其重要，作者强制要求的

      - name: 2. 准备环境 (Go 1.25.5 + Java 17)
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25.5'
      - name: 准备 Java
        run: |
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: 3. 准备作者指定的 NDK r28
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: 4. 关键：执行作者的库安装指令 (lib_install)
        # 这就是解决 gomobile missing 的官方终极手段
        run: |-
          make lib_install
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 5. 执行作者的库编译指令 (lib_android)
        # 这一步会现场生产出 libbox.aar 发动机
        run: |-
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: 6. 按照作者逻辑-进入子目录总装
        # 作者的逻辑是：把 aar 拷进去，然后 cd 到 clients/android 打包
        run: |-
          mkdir -p clients/android/app/libs
          cp *.aar clients/android/app/libs/
          cd clients/android
          chmod +x gradlew
          # 我们打 OtherRelease 版本，这是最通用的
          ./gradlew :app:assembleOtherRelease
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: 7. 地毯式收货
        run: |
          mkdir -p final_apks
          find clients/android/app/build/outputs/apk -name "*.apk" -exec cp {} ./final_apks/ \;
          ls -R ./final_apks/

      - name: 8. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-作者正宗APK
          path: ./final_apks/*.apk
