name: 大哥专线-全量无损打包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 初始化 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 授权并清理
        run: |
          chmod +x gradlew
          ./gradlew clean

      - name: 4. 全量打包 (不猜名字，全都要)
        # assembleDebug 会构建所有版本（play, universal 等）的测试版
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. 提货 (自动搜索所有生成的 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-全量安装包
          # 这样写会把所有打出来的 APK 全部打包发给你
          path: app/build/outputs/apk/**/*.apk
