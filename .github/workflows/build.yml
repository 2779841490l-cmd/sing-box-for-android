name: 大哥专线-全自动打包工厂

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 请出 Go 语言老师 (合成内核用)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 3. 请出 Java 老师 (安卓打包用)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. 授权工厂脚本
        run: chmod +x gradlew

      - name: 5. 暴力编译 (只打标准版，跳过那个报错的遗留版)
        run: ./gradlew :app:assembleStandardDebug

      - name: 6. 提货 (上传成品 APK)
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-测试版APK
          path: app/build/outputs/apk/standard/debug/*.apk
