name: 大哥专线-官方内核注入版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 初始化 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 智能捕获原装内核 (跳过所有编译报错)
        # 这一步我们直接调用 GitHub 官方库里的成品，不求人，不猜链接
        run: |
          mkdir -p app/libs
          # 核心操作：直接从 SagerNet 官方下载最新的 arm64 成品内核
          # 我们使用 1.10.1 这个最稳的版本，支持 Hy2 和 Reality
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          
          # 检查大小，如果还是 9 字节（报错页），我们立刻用备用稳定链
          FILESIZE=$(stat -c%s "app/libs/libbox.aar")
          if [ $FILESIZE -lt 1000000 ]; then
            echo "主链失效，启动备用稳定链..."
            curl -L "https://mirror.ghproxy.com/https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-android-arm64-v8a.aar" -o app/libs/libbox.aar
          fi
          echo "内核准备就绪，大小: $(ls -lh app/libs/libbox.aar)"

      - name: 4. 直接开始安卓总装
        # 不再运行任何 Go 命令，直接打安卓包
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 5. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-成品APK
          path: app/build/outputs/apk/**/*.apk
