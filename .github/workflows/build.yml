name: 大哥专线-官方内网直提版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 初始化 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 官方内网提货 (100% 成功率)
        # 使用 GitHub 官方 CLI 工具，直接从原作者仓库下载核心
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          echo "正在通过 GitHub 内网调拨内核..."
          
          # 直接下载 SagerNet/sing-box 仓库 v1.10.1 版本的 arm64 核心
          gh release download v1.10.1 --repo SagerNet/sing-box --pattern "libbox-android-arm64-v8a.aar" --output app/libs/libbox.aar
          
          # 物理检查
          FILESIZE=$(stat -c%s "app/libs/libbox.aar")
          echo "✅ 提货成功！内核体积: $FILESIZE 字节"
          
          if [ $FILESIZE -lt 10000000 ]; then
            echo "❌ 提货失败，文件体积异常！"
            exit 1
          fi

      - name: 4. 暴力总装 APK
        run: |
          chmod +x gradlew
          # 清理并开始打包，自动适配你的项目版本
          ./gradlew clean assembleDebug --stacktrace

      - name: 5. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-成品APK
          path: app/build/outputs/apk/**/*.apk
